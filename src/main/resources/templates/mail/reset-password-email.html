<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>임시 비밀번호 안내</title>
</head>
<body>
    <!--핵심: 레이아웃이 찾을 수 있도록 th:fragment="mail-content" 를 꼭 넣어줍니다. -->
    <div th:fragment="mail-content">
        <h3 style="margin: 0 0 15px 0; color: #333333; font-size: 20px; font-family: sans-serif;">임시 비밀번호 안내</h3>

        <p style="margin: 0 0 20px 0; color: #555555; font-size: 15px; font-family: sans-serif; line-height: 1.5;">
            <strong style="color: #007BFF;">[[${name}]]</strong>님, 요청하신 임시 비밀번호를 안내드립니다.
        </p>

        <!-- 이메일용 비밀번호 강조 박스 -->
        <div style="background-color: #f8f9fa; border: 1px solid #e9ecef; border-radius: 6px; padding: 20px; text-align: center; margin: 25px 0;">
            <span style="font-size: 13px; color: #777777; display: block; margin-bottom: 8px; font-family: sans-serif;">임시 비밀번호</span>
            <strong style="font-size: 24px; color: #dc3545; letter-spacing: 1px; font-family: monospace;">[[${tempPassword}]]</strong>
        </div>

        <p style="margin: 0; color: #888888; font-size: 13px; font-family: sans-serif;">
            ※ 안전한 개인정보 보호를 위해 로그인 후 마이페이지에서 반드시 비밀번호를 변경해 주세요.
        </p>
    </div>
</body>
</html>
