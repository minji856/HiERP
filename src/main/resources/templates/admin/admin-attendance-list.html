<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/user-layout}">
<head>
    <meta charset="UTF-8" name="viewport" content="width=device-width, initial-scale=1">
    <title>출퇴근 관리 대시보드</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/bootstrap/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/bootstrap/css/lineicons.css}">
</head>
<body>
<div layout:fragment="content">
    <div class="container-fluid">

        <!-- 페이지 제목 -->
        <div class="title-wrapper pt-30">
            <div class="row align-items-center">
                <div class="col-md-6">
                    <div class="title mb-30">
                        <h2>출퇴근 관리</h2>
                    </div>
                </div>
            </div>
        </div>

        <!-- 요약 카드 -->
        <div class="row">
            <div class="col-xl-4 col-md-6 mb-30">
                <div class="icon-card h-100">
                    <div class="icon primary"><i class="lni lni-calendar"></i></div>
                    <div class="content">
                        <h6 class="mb-10">전체 근태</h6>
                        <h3 class="text-bold mb-10"><span id="sum-total">0</span>건</h3>
                    </div>
                </div>
            </div>
            <div class="col-xl-4 col-md-6 mb-30">
                <div class="icon-card h-100">
                    <div class="icon orange"><i class="lni lni-alarm-clock"></i></div>
                    <div class="content">
                        <h6 class="mb-10">지각</h6>
                        <h3 class="text-bold mb-10"><span id="sum-late">0</span>건</h3>
                        <p class="text-sm text-danger"><span id="sum-late-emp">0</span>명</p>
                    </div>
                </div>
            </div>
            <div class="col-xl-4 col-md-6 mb-30">
                <div class="icon-card h-100">
                    <div class="icon purple"><i class="lni lni-exit"></i></div>
                    <div class="content">
                        <h6 class="mb-10">조퇴</h6>
                        <h3 class="text-bold mb-10"><span id="sum-early">0</span>건</h3>
                        <p class="text-sm text-danger"><span id="sum-early-emp">0</span>명</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- 조회 기간 -->
        <div class="row">
            <div class="col-lg-12">
                <div class="card-style mb-30">
                    <form id="filter-form" class="row align-items-end">
                        <div class="col-md-3">
                            <div class="input-style-1">
                                <label for="from">시작일</label>
                                <input type="date" id="from" required>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="input-style-1">
                                <label for="to">종료일</label>
                                <input type="date" id="to" required>
                            </div>
                        </div>
                        <div class="col-md-2 mb-30">
                            <button type="submit" class="main-btn primary-btn btn-hover btn-sm">조회</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- 출퇴근 현황 테이블 -->
        <div class="row">
            <div class="col-lg-12">
                <div class="card-style mb-30">
                    <h6 class="mb-10">사원별 출퇴근 현황</h6>

                    <p class="text-sm mb-20">
                        사원별 출근 및 퇴근 시간과 근태 상태를 확인할 수 있습니다.
                    </p>

                    <!-- 새로 추가: 모드 전환 버튼 -->
                    <div id="mode-group" class="mb-3">
                        <button type="button" data-mode="records" class="main-btn primary-btn btn-hover btn-sm">출근 기록</button>
                        <button type="button" data-mode="missing" class="main-btn primary-btn-outline btn-hover btn-sm">미출근</button>
                        <span id="mode-note" class="text-muted ms-2"></span>
                    </div>

                    <div class="table-wrapper table-responsive">
                        <table class="table">
                            <colgroup>
                                <col style="width: 15%;">
                                <col style="width: 15%;">
                                <col style="width: 15%;">
                                <col style="width: 15%;">
                                <col style="width: 20%;">
                                <col style="width: 20%;">
                            </colgroup>
                            <thead>
                            <tr>
                                <th><h6>날짜</h6></th>
                                <th><h6>사원명</h6></th>
                                <th><h6>출근 시간</h6></th>
                                <th><h6>퇴근 시간</h6></th>
                                <th><h6>근태 상태</h6></th>
                                <th><h6>특이 사항</h6></th>
                            </tr>
                            </thead>
                            <tbody id="attendance-rows">
                            <!-- JS가 채웁니다 -->
                            </tbody>
                        </table>
                    </div>

                    <!-- 페이지네이션 (2페이지 이상일 때 JS가 표시) -->
                    <div class="d-flex justify-content-center mt-30">
                        <nav aria-label="출퇴근 목록 페이지">
                            <ul class="pagination" id="pager"></ul>
                        </nav>
                    </div>
                </div>
            </div>
        </div>
    </div>


    <script th:inline="javascript">
        (function () {
            const API = /*[[@{/api/admin/attendance}]]*/ '/api/admin/attendance';
            const PAGE_SIZE = 20;
            const WEEKDAYS = ['일', '월', '화', '수', '목', '금', '토'];

            const STATUS_CLASS = {
                NORMAL: 'success-btn',
                ABSENT: 'close-btn',
                OFF_DUTY: 'light-btn'
            };

            // [추가] 조회 모드: 'records'(출근 기록, 기간) | 'missing'(미출근, 하루)
            let mode = 'records';
            let requestSeq = 0;   // 늦게 도착한 이전 응답이 화면을 덮어쓰지 않게 하는 번호
            const MODE_BTN_ACTIVE = 'main-btn primary-btn btn-hover btn-sm';
            const MODE_BTN_INACTIVE = 'main-btn primary-btn-outline btn-hover btn-sm';

            const fromEl = document.getElementById('from');
            const toEl = document.getElementById('to');
            const rowsEl = document.getElementById('attendance-rows');
            const pagerEl = document.getElementById('pager');
            const modeBtns = document.querySelectorAll('#mode-group [data-mode]');   // [추가]
            const modeNoteEl = document.getElementById('mode-note');                 // [추가]

            // ---------- DOM 헬퍼 ----------
            function el(tag, className, text) {
                const node = document.createElement(tag);
                if (className) node.className = className;
                if (text !== undefined && text !== null) {
                    node.textContent = text;
                }
                return node;
            }

            function cell(child) {
                const td = el('td', 'min-width');
                td.appendChild(child);
                return td;
            }

            function hhmm(dateTime) {
                return dateTime ? dateTime.slice(11, 16) : '-';
            }

            // ---------- 메시지 ----------
            function showMessage(text) {
                const tr = document.createElement('tr');
                const td = el('td', 'text-center py-4', text);
                td.colSpan = 6;   // [변경] 행이 6칸이라 6으로 맞춤 (thead 칸 수에 맞추세요)
                tr.appendChild(td);
                rowsEl.replaceChildren(tr);
                pagerEl.replaceChildren();
            }

            // ---------- 행 생성 (변경 없음) ----------
            function buildRow(a) {
                const tr = document.createElement('tr');

                // 날짜
                const workDate = a.workDate ? a.workDate : '-';

                if (a.workDate) {
                    const day = WEEKDAYS[new Date(a.workDate + 'T00:00:00').getDay()];
                    tr.appendChild(cell(el('p', '', workDate + ' (' + day + ')')));
                } else {
                    tr.appendChild(cell(el('p', 'text-muted', '-')));
                }

                // 사원명
                tr.appendChild(cell(el('p', '', a.name || '-')));

                // 출근 시간
                tr.appendChild(cell(
                    a.clockInTime
                        ? el('p', '', hhmm(a.clockInTime))
                        : el('p', 'text-muted', '미출근')
                ));

                // 퇴근 시간
                tr.appendChild(cell(
                    a.clockOutTime
                        ? el('p', '', hhmm(a.clockOutTime))
                        : el('p', 'text-muted', '-')
                ));

                // 근태 상태
                const statusClass = 'status-btn ' + (STATUS_CLASS[a.status] || 'light-btn');
                const statusText = a.statusTitle || '미출근';
                tr.appendChild(cell(el('span', statusClass, statusText)));

                // 특이 사항
                const remarks = el('td', 'min-width');

                if (a.late === true) {
                    remarks.appendChild(el('span', 'status-btn close-btn me-1', '지각'));
                }
                if (a.earlyLeave === true) {
                    remarks.appendChild(el('span', 'status-btn close-btn', '조퇴'));
                }
                if (a.late !== true && a.earlyLeave !== true) {
                    remarks.appendChild(el('span', 'text-muted', '-'));
                }

                tr.appendChild(remarks);
                return tr;
            }

            // ---------- 목록 렌더링 ----------
            function renderRows(items) {
                if (!items || items.length === 0) {
                    // [변경] 모드에 따라 문구 구분
                    showMessage(mode === 'missing'
                        ? '미출근한 직원이 없습니다.'
                        : '조회된 근태 기록이 없습니다.');
                    return;
                }
                rowsEl.replaceChildren(...items.map(buildRow));
            }

            // ---------- 요약 렌더링 (변경 없음) ----------
            function renderSummary(s) {
                document.getElementById('sum-total').textContent = s.total ?? 0;
                document.getElementById('sum-late').textContent = s.lateCount ?? 0;
                document.getElementById('sum-late-emp').textContent = s.lateEmployeeCount ?? 0;
                document.getElementById('sum-early').textContent = s.earlyLeaveCount ?? 0;
                document.getElementById('sum-early-emp').textContent = s.earlyLeaveEmployeeCount ?? 0;
            }

            // ---------- 페이지네이션 (변경 없음) ----------
            function pageItem(label, page, disabled, active) {
                const li = el('li',
                    'page-item' + (disabled ? ' disabled' : '') + (active ? ' active' : ''));

                const a = el('a', 'page-link', label);
                a.href = '#';

                a.addEventListener('click', function (e) {
                    e.preventDefault();
                    if (!disabled && !active) {
                        load(page);
                    }
                });

                li.appendChild(a);
                return li;
            }

            function renderPager(current, total) {
                if (total <= 1) {
                    pagerEl.replaceChildren();
                    return;
                }

                let start = Math.max(0, current - 2);
                const end = Math.min(total - 1, start + 4);
                start = Math.max(0, end - 4);

                const items = [pageItem('이전', current - 1, current === 0, false)];

                for (let p = start; p <= end; p++) {
                    items.push(pageItem(String(p + 1), p, false, p === current));
                }

                items.push(pageItem('다음', current + 1, current >= total - 1, false));
                pagerEl.replaceChildren(...items);
            }

            // ---------- API 호출 ----------
            async function load(page) {
                // [변경] 미출근 모드는 하루 기준이라 종료일 = 시작일
                const from = fromEl.value;
                const to = (mode === 'missing') ? from : toEl.value;

                if (from > to) {
                    alert('시작일이 종료일보다 늦을 수 없습니다.');
                    return;
                }

                const params = new URLSearchParams({ from: from, to: to });
                const paging = '&page=' + page + '&size=' + PAGE_SIZE;

                // [변경] 모드에 따라 목록 주소만 다름
                const listUrl = (mode === 'missing')
                    ? API + '/not-clocked-in?date=' + from + paging
                    : API + '?' + params + paging;

                const options = { headers: { 'Accept': 'application/json' } };
                const seq = ++requestSeq;   // [추가]

                try {
                    const [listRes, sumRes] = await Promise.all([
                        fetch(listUrl, options),
                        fetch(API + '/summary?' + params, options)
                    ]);

                    if (seq !== requestSeq) return;   // [추가] 더 최신 요청이 있으면 버림

                    if (listRes.redirected || sumRes.redirected) {
                        window.location.reload();
                        return;
                    }

                    if (!listRes.ok || !sumRes.ok) {
                        showMessage('조회에 실패했습니다. (' + listRes.status + ')');
                        return;
                    }

                    const list = await listRes.json();
                    const summary = await sumRes.json();

                    if (seq !== requestSeq) return;   // [추가]

                    renderSummary(summary);
                    renderRows(list.content);
                    renderPager(list.page.number, list.page.totalPages);

                    // 미출근 인원 표시 요소 못 넣을 시 스크립트 방어 코드
                    if (modeNoteEl) {
                        modeNoteEl.textContent = (mode === 'missing')
                            ? '미출근 ' + list.page.totalElements + '명'
                            : '';
                    }

                } catch (e) {
                    console.error(e);
                    if (seq === requestSeq) {
                        showMessage('서버와 통신하지 못했습니다.');
                    }
                }
            }

            // ---------- [추가] 모드 전환 ----------
            function setMode(next) {
                mode = next;

                modeBtns.forEach(function (b) {
                    b.className = (b.dataset.mode === mode) ? MODE_BTN_ACTIVE : MODE_BTN_INACTIVE;
                });

                if (mode === 'missing') {
                    toEl.value = fromEl.value;   // 하루 기준이라 종료일은 시작일과 동일하게
                    toEl.disabled = true;
                } else {
                    toEl.disabled = false;
                }

                load(0);
            }

            modeBtns.forEach(function (b) {
                b.addEventListener('click', function () {
                    if (b.dataset.mode !== mode) {
                        setMode(b.dataset.mode);
                    }
                });
            });

            fromEl.addEventListener('change', function () {
                if (mode === 'missing') {
                    toEl.value = fromEl.value;
                }
            });

            // ---------- 초기화 ----------
            const today = new Date().toLocaleDateString('sv-SE');

            fromEl.value = today;
            toEl.value = today;

            document.getElementById('filter-form')
                .addEventListener('submit', function (e) {
                    e.preventDefault();
                    load(0);
                });

            load(0);
        })();
    </script>
</div>
</body>
</html>
