<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/user-layout}">
<head>
    <meta charset="UTF-8" name="viewport" content="width=device-width, initial-scale=1">
    <title>출퇴근 관리 대시보드</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/bootstrap/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/bootstrap/css/lineicons.css}">
</head>
<body>
<div layout:fragment="content">
    <div class="container-fluid">

        <!-- 페이지 제목 -->
        <div class="title-wrapper pt-30">
            <div class="row align-items-center">
                <div class="col-md-6">
                    <div class="title mb-30">
                        <h2>출퇴근 관리</h2>
                    </div>
                </div>
            </div>
        </div>

        <!-- 요약 카드 -->
        <div class="row">
            <div class="col-xl-4 col-md-6 mb-30">
                <div class="icon-card h-100">
                    <div class="icon primary"><i class="lni lni-calendar"></i></div>
                    <div class="content">
                        <h6 class="mb-10">전체 근태</h6>
                        <h3 class="text-bold mb-10"><span id="sum-total">0</span>건</h3>
                    </div>
                </div>
            </div>
            <div class="col-xl-4 col-md-6 mb-30">
                <div class="icon-card h-100">
                    <div class="icon orange"><i class="lni lni-alarm-clock"></i></div>
                    <div class="content">
                        <h6 class="mb-10">지각</h6>
                        <h3 class="text-bold mb-10"><span id="sum-late">0</span>건</h3>
                        <p class="text-sm text-danger"><span id="sum-late-emp">0</span>명</p>
                    </div>
                </div>
            </div>
            <div class="col-xl-4 col-md-6 mb-30">
                <div class="icon-card h-100">
                    <div class="icon purple"><i class="lni lni-exit"></i></div>
                    <div class="content">
                        <h6 class="mb-10">조퇴</h6>
                        <h3 class="text-bold mb-10"><span id="sum-early">0</span>건</h3>
                        <p class="text-sm text-danger"><span id="sum-early-emp">0</span>명</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- 조회 기간 -->
        <div class="row">
            <div class="col-lg-12">
                <div class="card-style mb-30">
                    <form id="filter-form" class="row align-items-end">
                        <div class="col-md-3">
                            <div class="input-style-1">
                                <label for="from">시작일</label>
                                <input type="date" id="from" required>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="input-style-1">
                                <label for="to">종료일</label>
                                <input type="date" id="to" required>
                            </div>
                        </div>
                        <div class="col-md-2 mb-30">
                            <button type="submit" class="main-btn primary-btn btn-hover btn-sm">조회</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- 출퇴근 현황 테이블 -->
        <div class="row">
            <div class="col-lg-12">
                <div class="card-style mb-30">
                    <h6 class="mb-10">사원별 출퇴근 현황</h6>

                    <p class="text-sm mb-20">
                        사원별 출근 및 퇴근 시간과 근태 상태를 확인할 수 있습니다.
                    </p>

                    <div class="table-wrapper table-responsive">
                        <table class="table">
                            <colgroup>
                                <col style="width: 15%;">
                                <col style="width: 15%;">
                                <col style="width: 15%;">
                                <col style="width: 15%;">
                                <col style="width: 20%;">
                                <col style="width: 20%;">
                            </colgroup>
                            <thead>
                            <tr>
                                <th><h6>날짜</h6></th>
                                <th><h6>사원명</h6></th>
                                <th><h6>출근 시간</h6></th>
                                <th><h6>퇴근 시간</h6></th>
                                <th><h6>근태 상태</h6></th>
                                <th><h6>특이 사항</h6></th>
                            </tr>
                            </thead>
                            <tbody id="attendance-rows">
                            <!-- JS가 채웁니다 -->
                            </tbody>
                        </table>
                    </div>

                    <!-- 페이지네이션 (2페이지 이상일 때 JS가 표시) -->
                    <div class="d-flex justify-content-center mt-30">
                        <nav aria-label="출퇴근 목록 페이지">
                            <ul class="pagination" id="pager"></ul>
                        </nav>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        (function () {
            const API = /*[[@{/api/admin/attendance}]]*/ '/api/admin/attendance';
            const PAGE_SIZE = 20;
            const WEEKDAYS = ['일', '월', '화', '수', '목', '금', '토'];
            // 상태값 → PlainAdmin 배지 색. 없는 값은 light-btn
            const STATUS_CLASS = { NORMAL: 'success-btn', ABSENT: 'close-btn' };

            const fromEl = document.getElementById('from');
            const toEl = document.getElementById('to');
            const rowsEl = document.getElementById('attendance-rows');
            const pagerEl = document.getElementById('pager');

            // ---------- DOM 헬퍼 (textContent만 사용: 이름 등에 HTML이 들어가도 실행되지 않음) ----------
            function el(tag, className, text) {
                const node = document.createElement(tag);
                if (className) node.className = className;
                if (text !== undefined) node.textContent = text;
                return node;
            }

            function cell(child) {
                const td = el('td', 'min-width');
                td.appendChild(child);
                return td;
            }

            function hhmm(dateTime) {
                return dateTime.slice(11, 16);   // "2026-11-09T09:10:00" → "09:10"
            }

            // ---------- 렌더링 ----------
            function showMessage(text) {
                const tr = document.createElement('tr');
                const td = el('td', 'text-center py-4', text);
                td.colSpan = 6;
                tr.appendChild(td);
                rowsEl.replaceChildren(tr);
                pagerEl.replaceChildren();
            }

            function buildRow(a) {
                const tr = document.createElement('tr');

                // 날짜
                const day = WEEKDAYS[new Date(a.workDate + 'T00:00:00').getDay()];
                tr.appendChild(cell(el('p', '', a.workDate + ' (' + day + ')')));

                // 사원명
                tr.appendChild(cell(el('p', '', a.name)));

                // 출근 / 퇴근 시간
                tr.appendChild(cell(a.clockInTime
                    ? el('p', '', hhmm(a.clockInTime))
                    : el('p', 'text-muted', '미출근')));
                tr.appendChild(cell(a.clockOutTime
                    ? el('p', '', hhmm(a.clockOutTime))
                    : el('p', 'text-muted', '-')));

                // 근태 상태
                const statusClass = 'status-btn ' + (STATUS_CLASS[a.status] || 'light-btn');
                tr.appendChild(cell(el('span', statusClass, a.statusTitle || '미출근')));

                // 특이 사항
                const remarks = el('td', 'min-width');
                if (a.late) remarks.appendChild(el('span', 'status-btn close-btn me-1', '지각'));
                if (a.earlyLeave) remarks.appendChild(el('span', 'status-btn close-btn', '조퇴'));
                if (!a.late && !a.earlyLeave) remarks.appendChild(el('span', 'text-muted', '-'));
                tr.appendChild(remarks);

                return tr;
            }

            function renderRows(items) {
                if (items.length === 0) {
                    showMessage('조회된 출퇴근 기록이 없습니다.');
                    return;
                }
                rowsEl.replaceChildren(...items.map(buildRow));
            }

            function renderSummary(s) {
                document.getElementById('sum-total').textContent = s.total;
                document.getElementById('sum-late').textContent = s.lateCount;
                document.getElementById('sum-late-emp').textContent = s.lateEmployeeCount;
                document.getElementById('sum-early').textContent = s.earlyLeaveCount;
                document.getElementById('sum-early-emp').textContent = s.earlyLeaveEmployeeCount;
            }

            function pageItem(label, page, disabled, active) {
                const li = el('li', 'page-item' + (disabled ? ' disabled' : '') + (active ? ' active' : ''));
                const a = el('a', 'page-link', label);
                a.href = '#';
                a.addEventListener('click', function (e) {
                    e.preventDefault();
                    if (!disabled && !active) load(page);
                });
                li.appendChild(a);
                return li;
            }

            function renderPager(current, total) {
                if (total <= 1) {
                    pagerEl.replaceChildren();
                    return;
                }
                // 현재 페이지 주변 최대 5개만 표시
                let start = Math.max(0, current - 2);
                const end = Math.min(total - 1, start + 4);
                start = Math.max(0, end - 4);

                const items = [pageItem('이전', current - 1, current === 0, false)];
                for (let p = start; p <= end; p++) {
                    items.push(pageItem(String(p + 1), p, false, p === current));
                }
                items.push(pageItem('다음', current + 1, current >= total - 1, false));
                pagerEl.replaceChildren(...items);
            }

            // ---------- API 호출 ----------
            async function load(page) {
                if (fromEl.value > toEl.value) {          // yyyy-MM-dd는 문자열 비교가 날짜 비교와 같음
                    alert('시작일이 종료일보다 늦을 수 없습니다.');
                    return;
                }

                const params = new URLSearchParams({ from: fromEl.value, to: toEl.value });
                const options = { headers: { 'Accept': 'application/json' } };

                try {
                    const [listRes, sumRes] = await Promise.all([
                        fetch(API + '?' + params + '&page=' + page + '&size=' + PAGE_SIZE, options),
                        fetch(API + '/summary?' + params, options)
                    ]);

                    // 세션이 만료되면 로그인 페이지로 리다이렉트된 HTML이 돌아옴 → 새로고침해서 로그인 화면으로
                    if (listRes.redirected || sumRes.redirected) {
                        window.location.reload();
                        return;
                    }
                    if (!listRes.ok || !sumRes.ok) {
                        showMessage('조회에 실패했습니다. (' + listRes.status + ')');
                        return;
                    }

                    const list = await listRes.json();
                    renderSummary(await sumRes.json());
                    renderRows(list.content);
                    renderPager(list.page.number, list.page.totalPages);
                } catch (e) {
                    showMessage('서버와 통신하지 못했습니다.');
                }
            }

            // ---------- 초기화 ----------
            const today = new Date().toLocaleDateString('sv-SE');   // 로컬 날짜를 yyyy-MM-dd로
            fromEl.value = today;
            toEl.value = today;

            document.getElementById('filter-form').addEventListener('submit', function (e) {
                e.preventDefault();
                load(0);
            });

            load(0);
        })();
    </script>
</div>
</body>
</html>
