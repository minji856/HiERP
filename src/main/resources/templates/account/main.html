<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/user-layout}">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hi-E</title>
</head>

<body>
<div layout:fragment="content">
    <section class="section">
        <div class="container-fluid">
            <!--title start-->
            <div class="title-wrapper pt-30">
                <div class="row align-items-center">
                    <div class="col-md-6">
                        <div class="title">
                            <h2><font dir="auto" style="vertical-align: inherit;"><font dir="auto"
                                                                                        style="vertical-align: inherit;">HiE
                                대시보드</font></font></h2>
                        </div>
                    </div>
                    <!-- end col -->
                </div>
            </div>
            <div class="row">
                <div class="col-lg-7">
                    <div class="card-style mb-30">
                        <div class="title d-flex flex-wrap justify-content-between">
                            <div class="left">
                                <h6 class="text-medium mb-30">
                                    <font dir="auto" style="vertical-align: inherit;">
                                        <font dir="auto" style="vertical-align: inherit;">공지사항</font>
                                    </font>
                                </h6>
                            </div>
                        </div>
                        <!--end title-->
                        <div th:replace="~{board/notice :: noticeFragment}" class="table-responsive"></div>
                    </div>
                </div>
                <div class="col-lg-5">
                    <div class="card-style calendar-card mb-30">
                        <!-- [필수] 프래그먼트 내부 스크립트가 실행될 때 isAdmin 변수가 여기서 생성되도록 위치시킵니다 -->
                        <script th:inline="javascript">
                            /*<![CDATA[*/
                            const isAdmin = /*[[${#authorization.expression('hasRole(''ADMIN'')')}]]*/ false;
                            console.log("프래그먼트 내부에서 찍어본 isAdmin:", isAdmin);
                            /*]]>*/
                        </script>

<!--                        <div id="calendar-mini" class="fc fc-media-screen fc-direction-ltr fc-theme-standard">-->
                            <div th:replace="~{calendar :: calendarFragment('calendar-mini')}"></div>
<!--                        </div>-->
                    </div>
                </div>
            </div>
        </div>
    </section>

    <div th:replace="~{modal/eventModal :: eventModal}"></div>
    <div th:replace="~{modal/eventDetailModal :: eventDetail}"></div>
</div>

<th:block layout:fragment="script">
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.19/index.global.min.js'></script>
</th:block>
</body>
</html>
