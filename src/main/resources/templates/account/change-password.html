<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/user-layout}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--CSS-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/bootstrap/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/bootstrap/css/lineicons.css}">
    <title>비밀번호 변경</title>
</head>
<body>
<div layout:fragment="content">

    <!-- SweetAlert2 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <div class="container-fluid">
        <!-- 타이틀 영역 -->
        <div class="title-wrapper pt-30">
            <div class="row align-items-center">
                <div class="col-md-6">
                    <div class="title mb-30">
                        <h2>비밀번호 변경</h2>
                    </div>
                </div>
            </div>
        </div>

            <!-- 본문 폼 영역 -->
            <div class="row">
                <div class="col-lg-12">
                    <div class="card-style mb-30">
                        <h6 class="mb-25">비밀번호 수정</h6>

                        <!-- 임시 비밀번호 사용자 전용 안내 메시지 -->
                        <div th:if="${isTempPassword}" class="alert-box warning-alert mb-20">
                            <div class="alert">
                                <p class="text-medium">🔒 임시 비밀번호로 로그인하셨습니다. 안전한 이용을 위해 새 비밀번호를 설정해 주세요.</p>
                            </div>
                        </div>

                        <!-- 에러 메시지 표시 -->
                        <div th:if="${error}" class="alert-box danger-alert mb-20">
                            <div class="alert">
                                <p class="text-medium" th:text="${error}"></p>
                            </div>
                        </div>

                        <!-- 성공 메시지 표시 -->
                        <div th:if="${message}" class="alert-box success-alert mb-20">
                            <div class="alert">
                                <p class="text-medium" th:text="${message}"></p>
                            </div>
                        </div>

                        <!-- 비밀번호 변경 폼 -->
                        <form id="changePasswordForm" th:action="@{/account/change-password}" method="post">
                            <!-- 핵심: 임시 비밀번호 로그인 상태가 아닐 때만 '현재 비밀번호' 표시 -->
                            <div class="input-style-1" th:if="${!isTempPassword}">
                                <label>현재 비밀번호</label>
                                <input type="password" name="exPassword" placeholder="현재 비밀번호를 입력하세요"
                                       th:required="${!isTempPassword}" />
                            </div>

                            <!-- 새 비밀번호 -->
                            <div class="input-style-1">
                                <label>새 비밀번호</label>
                                <input type="password" name="newPassword" placeholder="새 비밀번호를 입력하세요" required/>
                            </div>

                            <!-- 새 비밀번호 확인 -->
                            <div class="input-style-1">
                                <label>새 비밀번호 확인</label>
                                <input type="password" name="newPasswordChk" placeholder="새 비밀번호를 한번 더 입력하세요" required/>
                            </div>

                            <!-- 버튼 그룹 -->
                            <div class="d-flex flex-wrap gap-3 mt-30">
                                <button type="button" id="btnSubmit" class="main-btn primary-btn btn-hover">
                                    <i class="lni lni-key mr-10"></i> 비밀번호 변경
                                </button>
                                <!-- 마이페이지로 돌아가는 취소 버튼 -->
                                <a th:href="@{/account/mypage}" class="main-btn primary-btn-outline btn-hover">
                                    취소
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    <!-- 💡 핵심: 스크립트 위치를 content 프래그먼트 내부로 이동 -->
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const btnSubmit = document.getElementById('btnSubmit');
            const form = document.getElementById('changePasswordForm');

            if (btnSubmit) {
                btnSubmit.addEventListener('click', function (e) {
                    // 브라우저 기본 required 유효성 검사 실행
                    if (!form.checkValidity()) {
                        form.reportValidity();
                        return;
                    }

                    // 예쁜 확인 모달창 띄우기
                    Swal.fire({
                        title: '비밀번호 변경',
                        text: '비밀번호를 정말 변경하시겠습니까?',
                        icon: 'question',
                        showCancelButton: true,
                        confirmButtonColor: '#4a6cf7', // PlainAdmin 기본 블루 컬러
                        cancelButtonColor: '#6c757d',
                        confirmButtonText: '변경',
                        cancelButtonText: '취소'
                    }).then((result) => {
                        if (result.isConfirmed) {
                            form.submit(); // 사용자가 '변경'을 눌렀을 때만 폼 제출
                        }
                    });
                });
            }
        });
    </script>
    </div>
</body>
</html>
